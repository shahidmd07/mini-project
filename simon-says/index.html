<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simon Says</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="game-container">
            <h1>Simon Says</h1>

            <h2>Click Start to play</h2>

            <div class="score-container">
                <div>
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>

                <div>
                    <span>Highest Score</span>
                    <strong id="high-score">0</strong>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-info">
                    <span>Level Progress</span>
                    <span id="progress-text">0 / 0</span>
                </div>

                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>

            <button id="start-btn">Start Game</button>

            <div class="box-container">
                <div class="line-one">
                    <button class="btn red" type="button" id="red"></button>
                    <button class="btn yellow" type="button" id="yellow"></button>
                </div>

                <div class="line-two">
                    <button class="btn green" type="button" id="green"></button>
                    <button class="btn purple" type="button" id="purple"></button>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
